<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const mode = params.get('mode') || 'host';
const initialRoom = (params.get('room') || '').toUpperCase();
const LOCAL_KEY = 'olympia-demo-state-v1';
const LEGACY_BANK_KEY = 'olympia-question-bank-v1';
const BOOST_BANK_KEY = 'olympia-boost-bank-v1';
const FINAL_BANK_KEY = 'olympia-final-bank-v2';
const sampleFinalBank = [
{id:'s10a',points:10,topic:'Khoa học',q:'Công thức hóa học của nước là gì?',a:'H₂O'},
{id:'s10b',points:10,topic:'Địa lý',q:'Thủ đô của Nhật Bản là thành phố nào?',a:'Tokyo'},
{id:'s10c',points:10,topic:'Toán học',q:'Phân số 3/4 tương đương bao nhiêu phần trăm?',a:'75%'},
{id:'s10d',points:10,topic:'Vật lý',q:'1 kilowatt bằng bao nhiêu watt?',a:'1000 watt'},
{id:'s10e',points:10,topic:'Thiên văn',q:'Hành tinh nào thường được gọi là Hành tinh Đỏ?',a:'Sao Hỏa'},
{id:'s20a',points:20,topic:'Sinh học',q:'Trong quá trình quang hợp, thực vật hấp thụ khí nào từ không khí?',a:'Carbon dioxide (CO₂)'},
{id:'s20b',points:20,topic:'Hóa học',q:'Ký hiệu hóa học Fe là của nguyên tố nào?',a:'Sắt'},
{id:'s20c',points:20,topic:'Lịch sử',q:'Ngày giải phóng miền Nam, thống nhất đất nước là ngày nào?',a:'30/4/1975'},
{id:'s20d',points:20,topic:'Toán học',q:'Tổng ba góc trong một tam giác bằng bao nhiêu độ?',a:'180 độ'},
{id:'s20e',points:20,topic:'Địa lý',q:'Đại dương nào lớn nhất trên Trái Đất?',a:'Thái Bình Dương'},
{id:'s30a',points:30,topic:'Vật lý',q:'Tốc độ ánh sáng trong chân không xấp xỉ bao nhiêu km/s?',a:'300.000 km/s'},
{id:'s30b',points:30,topic:'Văn học',q:'Ai là tác giả của Truyện Kiều?',a:'Nguyễn Du'},
{id:'s30c',points:30,topic:'Sinh học',q:'Một tế bào sinh dưỡng bình thường của người có bao nhiêu nhiễm sắc thể?',a:'46 nhiễm sắc thể'},
{id:'s30d',points:30,topic:'Vật lý',q:'Định luật Ôm được biểu diễn bằng công thức nào?',a:'U = I × R'},
{id:'s30e',points:30,topic:'Địa lý',q:'Đỉnh núi nào cao nhất thế giới so với mực nước biển?',a:'Everest'}
];
const sampleBoostBank = [
{id:'b01',topic:'Khoa học',q:'Hành tinh nào gần Mặt Trời nhất?',a:'Sao Thủy'},
{id:'b02',topic:'Toán học',q:'7 nhân 8 bằng bao nhiêu?',a:'56'},
{id:'b03',topic:'Địa lý',q:'Việt Nam có bao nhiêu tỉnh, thành phố trực thuộc trung ương theo đơn vị hành chính cấp tỉnh hiện nay?',a:'34'},
{id:'b04',topic:'Văn học',q:'Ai là tác giả bài thơ Đồng chí?',a:'Chính Hữu'},
{id:'b05',topic:'Hóa học',q:'Ký hiệu hóa học của vàng là gì?',a:'Au'},
{id:'b06',topic:'Sinh học',q:'Cơ quan nào bơm máu đi khắp cơ thể người?',a:'Tim'},
{id:'b07',topic:'Lịch sử',q:'Chiến thắng Điện Biên Phủ diễn ra năm nào?',a:'1954'},
{id:'b08',topic:'Vật lý',q:'Đơn vị đo cường độ dòng điện là gì?',a:'Ampe'},
{id:'b09',topic:'Tiếng Anh',q:'Từ tiếng Anh “library” có nghĩa là gì?',a:'Thư viện'},
{id:'b10',topic:'Toán học',q:'Số nguyên tố nhỏ nhất là số nào?',a:'2'}
];
function readBankArray(key){
 try{const raw=localStorage.getItem(key);if(raw===null)return null;const value=JSON.parse(raw);return Array.isArray(value)?value:null}catch(e){return null}
}
function loadFinalBank(){
 const current=readBankArray(FINAL_BANK_KEY);
 const source=current!==null?current:(readBankArray(LEGACY_BANK_KEY)||sampleFinalBank);
 return source.filter(x=>x&&x.q&&x.a&&[10,20,30].includes(Number(x.points))).map((x,i)=>({id:x.id||('final'+i),points:Number(x.points),topic:String(x.topic||'Tổng hợp'),q:String(x.q),a:String(x.a)}));
}
function loadBoostBank(){
 const source=readBankArray(BOOST_BANK_KEY);
 return (source===null?sampleBoostBank:source).filter(x=>x&&x.q&&x.a).map((x,i)=>({id:x.id||('boost'+i),topic:String(x.topic||'Tổng hợp'),q:String(x.q),a:String(x.a)}));
}
let boostBank = loadBoostBank();
let finalBank = loadFinalBank();
function saveBoostBank(){localStorage.setItem(BOOST_BANK_KEY,JSON.stringify(boostBank))}
function saveFinalBank(){localStorage.setItem(FINAL_BANK_KEY,JSON.stringify(finalBank))}

let state = null, db = null, auth = null, uid = null, roomCode = initialRoom;
let cloud = false, joined = false, playerSlot = 0, playerName = '', hostPlayers = {}, submissions = {};
let stateListener = null, playerListener = null, submissionListener = null, buzzListener = null, starNext = false;
let processedBuzzQid = '';
let timerHandle = null, autoLocking = false;

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
function defaultState(){return {roomCode:'',phase:'lobby',names:['Thí sinh 1','Thí sinh 2','Thí sinh 3','Thí sinh 4','Thí sinh 5'],scores:[0,0,0,0,0],boost:{active:false,id:'',qid:'',question:'',duration:60,startedAt:0,marks:{},used:[],result:[]},final:{order:[],orderIndex:0,qCount:[0,0,0,0,0],starUsed:[false,false,false,false,false],used:[],current:null},updatedAt:Date.now()}}
function normalizeState(raw){
 const base=defaultState();
 const value=raw&&typeof raw==='object'?raw:{};
 const boost=Object.assign({},base.boost,value.boost||{});
 const final=Object.assign({},base.final,value.final||{});
 boost.used=Array.isArray(boost.used)?boost.used:[];
 boost.result=Array.isArray(boost.result)?boost.result:[];
 boost.marks=boost.marks&&typeof boost.marks==='object'?boost.marks:{};
 final.used=Array.isArray(final.used)?final.used:[];
 final.order=Array.isArray(final.order)?final.order:[];
 final.qCount=Array.isArray(final.qCount)?final.qCount:[0,0,0,0,0];
 final.starUsed=Array.isArray(final.starUsed)?final.starUsed:[false,false,false,false,false];
 return Object.assign(base,value,{names:Array.isArray(value.names)?value.names:base.names,scores:Array.isArray(value.scores)?value.scores:base.scores,boost:boost,final:final});
}
function validConfig(){const c=window.FIREBASE_CONFIG||{};return !!(c.apiKey&&c.databaseURL&&c.projectId&&c.appId)}
async function connectCloud(){
 if(!validConfig())return false;
 try{if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);auth=firebase.auth();db=firebase.database();await auth.signInAnonymously();uid=auth.currentUser.uid;cloud=true;return true}
 catch(e){console.error(e);cloud=false;return false}
}
function localSave(){if(state){state.updatedAt=Date.now();localStorage.setItem(LOCAL_KEY,JSON.stringify(state));render()}}
async function saveState(next){state=normalizeState(next);state.updatedAt=Date.now();render();if(cloud&&db&&roomCode){try{await db.ref('rooms/'+roomCode+'/state').set(state)}catch(e){toast('Không thể đồng bộ: '+e.message)}}else{localStorage.setItem(LOCAL_KEY,JSON.stringify(state))}}
function bindState(path,callback){
 if(stateListener)stateListener.off();
 stateListener=db.ref(path+'/state');
 stateListener.on('value',snap=>{const v=snap.val();if(v){state=normalizeState(v);roomCode=v.roomCode||roomCode;callback&&callback();render()}});
}
function bindHostRoom(){
 const root='rooms/'+roomCode;
 bindState(root,()=>{if(state&&state.boost&&state.boost.id)bindSubmissions(state.boost.id)});
 if(playerListener)playerListener.off();
 playerListener=db.ref(root+'/players');
 playerListener.on('value',snap=>{
  hostPlayers=snap.val()||{};
  if(state&&state.names){let changed=false;Object.values(hostPlayers).forEach(p=>{if(p&&p.slot>=1&&p.slot<=5&&p.name&&state.names[p.slot-1]!==p.name){state.names[p.slot-1]=p.name;changed=true}});if(changed)saveState(state)}
  render();
 });
 if(state&&state.boost&&state.boost.id)bindSubmissions(state.boost.id);
 if(buzzListener)buzzListener.off();
 buzzListener=db.ref(root+'/buzz');
 buzzListener.on('value',snap=>{
  const claims=snap.val()||{};
  const cur=state&&state.final&&state.final.current;
  if(!cur||cur.status!=='steal'||cur.buzzed)return;
  const claim=claims[cur.qid];
  if(!claim||processedBuzzQid===cur.qid)return;
  processedBuzzQid=cur.qid;
  const next=Object.assign({},state);next.final=JSON.parse(JSON.stringify(state.final));
  next.final.current.buzzed=Number(claim.slot);
  next.final.current.status='steal-answer';
  next.final.current.startedAt=Date.now();
  next.final.current.duration=60;
  saveState(next).catch(err=>{processedBuzzQid='';console.error(err);toast('Không thể cập nhật người giành chuông: '+err.message)});
 });

function addBoostQuestion(form){

 saveBoostBank();form.reset();render();toast('Đã thêm câu hỏi Tăng tốc');
}
function addFinalQuestion(form){
 const fd=new FormData(form),q=String(fd.get('q')||'').trim(),a=String(fd.get('a')||'').trim();
 if(!q||!a)return;
 finalBank.push({id:'final'+Date.now(),points:Number(fd.get('points')),topic:String(fd.get('topic')||'Tổng hợp'),q:q,a:a});
 saveFinalBank();form.reset();render();toast('Đã thêm câu hỏi Về đích');
}
async function joinRoom(){
 if(!cloud||!db){toast('Chưa kết nối Firebase');return}
 const code=($('join-room').value||'').trim().toUpperCase();const slot=Number($('join-slot').value);const name=($('join-name').value||'').trim();
 if(!code||!name){toast('Hãy nhập mã phòng và tên');return}
 const root='rooms/'+code;
 const snap=await db.ref(root+'/state').once('value');
 if(!snap.exists()){toast('Không tìm thấy phòng thi');return}
 const all=await db.ref(root+'/players').once('value');const people=all.val()||{};
 const occupied=Object.keys(people).some(k=>k!==uid&&Number(people[k].slot)===slot);
 if(occupied){toast('Số báo danh này đã có người sử dụng');return}
 await db.ref(root+'/players/'+uid).set({slot:slot,name:name,joinedAt:Date.now()});
 roomCode=code;playerSlot=slot;playerName=name;joined=true;state=snap.val();bindState(root,render);render();
}
async function submitAnswer(form){
 if(!cloud||!db||!state||!state.boost||!state.boost.active)return;
 const answer=String(new FormData(form).get('answer')||'').trim();if(!answer)return;
 const b=state.boost;if(Date.now()>(b.startedAt+b.duration*1000)){toast('Đã hết giờ');return}
 const ref=db.ref('rooms/'+roomCode+'/submissions/boost/'+b.id+'/'+uid);
 const result=await ref.transaction(current=>current||{slot:playerSlot,name:playerName,answer:answer,submittedAt:firebase.database.ServerValue.TIMESTAMP});
 if(result.committed){$('app').dataset.submitted='yes';render();toast('Đã gửi đáp án!')}else toast('Bạn đã gửi đáp án cho câu này rồi');
}
async function startBoostQuestion(id){

 submissions={};
 if(state.boost&&state.boost.id&&!state.boost.awarded){toast('Hãy chấm điểm câu hiện tại trước');return}
 const b={active:true,id:'b'+Date.now(),qid:q.id,question:q.q,answer:q.a,duration:60,startedAt:Date.now(),marks:{},used:(state.boost&&state.boost.used)||[],result:[],awarded:false};
 await saveState(Object.assign({},state,{phase:'boost',boost:b}));

async function markBoost(slot,mark){

async function awardBoost(){
 if(state.boost.active){toast('Hãy khóa câu trả lời trước');return}
 if(state.boost.awarded){toast('Câu này đã được chấm điểm');return}
 const entries=Object.values(submissions||{}).sort((a,b)=>(a.submittedAt||0)-(b.submittedAt||0));
 if(entries.some(x=>!state.boost.marks||state.boost.marks[x.slot]===undefined)){toast('Hãy đánh dấu đúng hoặc sai cho tất cả đáp án trước');return}
 const pts=[40,30,20,10,0];const next=Object.assign({},state);next.scores=state.scores.slice();
 const result=entries.map((x,i)=>{const correct=state.boost.marks&&state.boost.marks[x.slot]===true;const points=correct?pts[Math.min(i,4)]:0;if(correct)next.scores[x.slot-1]+=points;return {slot:x.slot,answer:x.answer,correct:!!correct,rank:i+1,points:points,elapsedMs:Math.max(0,Number(x.submittedAt||0)-Number(state.boost.startedAt||0))}});
 next.boost=Object.assign({},state.boost,{result:result,used:[...(state.boost.used||[]),state.boost.qid],awarded:true});
 await saveState(next);toast('Đã cộng điểm Tăng tốc');
}
async function startFinal(){
 const order=[1,2,3,4,5].sort((a,b)=>Number(state.scores[b-1]||0)-Number(state.scores[a-1]||0));
 await saveState(Object.assign({},state,{phase:'final',final:{order:order,orderIndex:0,qCount:[0,0,0,0,0],starUsed:[false,false,false,false,false],used:[],current:null}}));
 starNext=false;
}
async function chooseFinalPackage(points){
 const f=state.final||{};const order=Array.isArray(f.order)?f.order:[];const slot=order[Number(f.orderIndex)||0];const star=$('star-next')?$('star-next').checked:false;
 if(!slot){toast('Không tìm thấy lượt thi Về đích. Hãy bắt đầu lại phần thi.');return}
 const used=Array.isArray(f.used)?f.used:[];
 const available=finalBank.filter(x=>Number(x.points)===Number(points)&&!used.includes(x.id));
 if(!available.length){toast('Gói '+points+' điểm đã hết câu hỏi chưa dùng');return}
 const q=available[Math.floor(Math.random()*available.length)];
 const next=Object.assign({},state);next.final=JSON.parse(JSON.stringify(f));next.final.used=Array.isArray(next.final.used)?next.final.used:[];next.final.used.push(q.id);if(star){next.final.starUsed=Array.isArray(next.final.starUsed)?next.final.starUsed:[false,false,false,false,false];next.final.starUsed[slot-1]=true;}
 next.final.current={qid:q.id,question:q.q,slot:slot,points:points,star:star,status:'asking',duration:60,startedAt:Date.now(),buzzed:null,mainJudged:false,completed:false};
 await saveState(next);starNext=false;
}
async function judgeMain(correct){
 const next=Object.assign({},state);next.final=JSON.parse(JSON.stringify(state.final));const c=next.final.current;const mult=c.star?2:1;
 if(correct){next.scores[c.slot-1]+=c.points*mult;c.status='done';c.completed=true;c.outcome='main-correct'}
 else{if(c.star)next.scores[c.slot-1]-=c.points*mult;c.status='steal';c.mainJudged=true;c.outcome='main-wrong'}
 await saveState(next);
}
async function buzz(slot){
 if(!state||!state.final||!state.final.current)return;
 if(!Number.isInteger(Number(slot))||Number(slot)<1||Number(slot)>5)return;
 const c=state.final.current;
 if(c.status!=='steal'||c.buzzed||Number(slot)===Number(c.slot))return;
 if(mode==='player'&&cloud&&db&&roomCode){
  const ref=db.ref('rooms/'+roomCode+'/buzz/'+c.qid);
  const result=await ref.transaction(current=>current||{slot:Number(slot),uid:uid,name:playerName,claimedAt:firebase.database.ServerValue.TIMESTAMP});
  if(result.committed)toast('Đã ghi nhận lượt bấm chuông! Chờ MC xác nhận.');
  else toast('Rất tiếc, người khác đã bấm chuông trước!');
  return;
 }
 const next=Object.assign({},state);next.final=JSON.parse(JSON.stringify(state.final));next.final.current.buzzed=Number(slot);next.final.current.status='steal-answer';next.final.current.startedAt=Date.now();next.final.current.duration=60;await saveState(next);
}
async function judgeSteal(correct){
 const next=Object.assign({},state);next.final=JSON.parse(JSON.stringify(state.final));const c=next.final.current;
 if(correct)next.scores[c.buzzed-1]+=c.points;
 c.status='done';c.completed=true;c.outcome=correct?'steal-correct':'steal-wrong';await saveState(next);
}
async function finishCurrent(){
 const next=Object.assign({},state);next.final=JSON.parse(JSON.stringify(state.final));const f=next.final,c=f.current;
 if(!c||!c.completed){toast('Hãy chấm xong câu hỏi trước');return}
 f.qCount[c.slot-1]+=1;f.current=null;
 if(f.qCount[c.slot-1]>=2)f.orderIndex+=1;
 if(f.orderIndex>=5)next.phase='complete';
 await saveState(next);
}
async function resetGame(){
 if(!confirm('Tạo ván mới và xóa toàn bộ điểm hiện tại?'))return;

}
function exportBank(which){
 const list=which==='boost'?boostBank:finalBank;
 const blob=new Blob([JSON.stringify(list,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=which==='boost'?'ngan-hang-tang-toc.json':'ngan-hang-ve-dich.json';a.click();URL.revokeObjectURL(url);
}
function downloadBankFile(file,which){
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const val=JSON.parse(reader.result);
   if(!Array.isArray(val)||!val.every(x=>x&&x.q&&x.a&&typeof x.q==='string'&&typeof x.a==='string'))throw new Error('Cấu trúc không hợp lệ');
   if(which==='boost'){
    boostBank=val.map((x,i)=>({id:x.id||('boost-import-'+Date.now()+'-'+i),topic:x.topic||'Tổng hợp',q:String(x.q),a:String(x.a)}));
    saveBoostBank();
   }else{
    if(!val.every(x=>[10,20,30].includes(Number(x.points))))throw new Error('Mỗi câu Về đích phải có gói 10, 20 hoặc 30 điểm');
    finalBank=val.map((x,i)=>({id:x.id||('final-import-'+Date.now()+'-'+i),points:Number(x.points),topic:x.topic||'Tổng hợp',q:String(x.q),a:String(x.a)}));
    saveFinalBank();
   }
   render();toast('Đã nhập ngân hàng '+(which==='boost'?'Tăng tốc':'Về đích'));
  }catch(e){toast('File JSON không hợp lệ: '+e.message)}
 };
 reader.readAsText(file);
}

function updateTimers(){
 if(mode==='host'&&state&&state.phase==='boost'&&state.boost&&state.boost.active&&state.boost.startedAt&&!autoLocking&&Date.now()>=state.boost.startedAt+state.boost.duration*1000){
  autoLocking=true;
  const nextState=Object.assign({},state);nextState.boost=Object.assign({},state.boost,{active:false});
  saveState(nextState).finally(()=>{autoLocking=false});
 }
 document.querySelectorAll('[data-timer]').forEach(el=>{
  let q=null;if(state&&mode==='player'&&state.phase==='boost')q=state.boost;
  else if(state&&mode==='screen'&&state.phase==='boost')q=state.boost;
  else if(state&&mode==='screen'&&state.phase==='final'&&state.final.current)q=state.final.current;
  if(!q||!q.startedAt){el.textContent='--';return}
  const left=Math.max(0,Math.ceil((q.startedAt+q.duration*1000-Date.now())/1000));el.textContent=String(left).padStart(2,'0');
  if(left===0)el.style.color='var(--red)';
 });
}
setInterval(updateTimers,250);
window.addEventListener('beforeunload',()=>{if(stateListener)stateListener.off();if(playerListener)playerListener.off();if(submissionListener)submissionListener.off()});
(async function init(){
 if(mode==='host'){await initHost()}
 else if(mode==='screen'){await initScreen()}
 else if(mode==='player'){const ok=await connectCloud();if(initialRoom&&ok){roomCode=initialRoom;renderPlayerJoin(true)}else renderPlayerJoin(false)}
 else renderHost();
})();
})();
</script>
